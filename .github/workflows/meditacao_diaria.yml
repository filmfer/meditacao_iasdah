name: Publicar Meditação Diária no Telegram e WhatsApp

on:
  schedule:
    # GitHub Actions utiliza UTC. A hora de PUBLICAÇÃO não depende da hora
    # a que o GitHub arranca o run: o workflow calcula a hora real nos
    # Açores e espera até às 07:00 locais antes de publicar (janela fixa
    # 07:00-07:59, todos os dias do ano).
    #
    # Como o scheduler do GitHub não tem SLA (atrasos de 15-60 min são
    # comuns), há TRÊS disparos redundantes; a deduplicação diária garante
    # que só o primeiro publica:
    #
    #  1) 05:00 UTC — margem principal contra atrasos do scheduler:
    #     Verão (WEST, UTC+1):  06:00 Açores -> espera 1h
    #     Inverno (WET, UTC+0): 05:00 Açores -> espera 2h
    #  2) 06:30 UTC — redundância (atrasos longos ou run anterior falhado):
    #     Verão:  07:30 Açores (publica de imediato, dentro da janela)
    #     Inverno: 06:30 Açores -> espera 30 min
    #  3) 08:15 UTC — sentinela: se nada foi publicado até esta hora,
    #     falha a verificação de janela e envia alerta Telegram imediato.
    - cron: '0 5 * * *'
    - cron: '30 6 * * *'
    - cron: '15 8 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: 'Ignorar a verificação de duplicação diária e publicar na mesma'
        type: boolean
        required: false
        default: false
      test_mode:
        description: 'TEMPORÁRIO (testes): ignora deduplicação e a janela 07:00-08:00; publica de imediato'
        type: boolean
        required: false
        default: false


# GITHUB_TOKEN com o mínimo necessário: ler metadados (deduplicação via API
# de workflow runs) e descarregar o artefacto da sessão WhatsApp.
permissions:
  contents: read
  actions: read

# Serializa as execuções do mesmo workflow: com três disparos diários, um
# run só começa quando o anterior terminar. Assim, o run seguinte é sempre
# travado pela deduplicação (se o anterior teve sucesso) ou serve de retry
# (se falhou) — nunca há duas publicações em paralelo.
concurrency:
  group: meditacao-diaria
  cancel-in-progress: false


jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # REPOSITÓRIO
      # ============================================================

      - name: Check out uma cópia do repositório
        uses: actions/checkout@v4


      # ============================================================
      # DEDUPLICAÇÃO DIÁRIA
      # ============================================================
      # Proteção contra publicações duplicadas no mesmo dia:
      # - runs agendados duplicados ou atrasados;
      # - execuções manuais quando o agendamento já correu com sucesso.
      # Consulta a API de workflow runs e salta a execução se já existir
      # um run de hoje concluído com sucesso (ou ainda em curso, para
      # cobrir a corrida entre um run agendado e um manual simultâneos).
      # Em caso de erro na API, falha aberta: publica na mesma — é pior
      # ficar um dia sem meditação do que arriscar um duplicado.

      - name: Verificar se já foi publicado hoje
        if: inputs.force != true && inputs.test_mode != true
        id: dedup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          TODAY=$(TZ=Atlantic/Azores date +%F)
          echo "Data de referência (Atlantic/Azores): ${TODAY}"

          HTTP_CODE=$(curl -s -o runs.json -w '%{http_code}' -G \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "created=>=${TODAY}" \
            --data-urlencode "per_page=100" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/meditacao_diaria.yml/runs")

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::warning::Deduplicação indisponível (HTTP ${HTTP_CODE}). A prosseguir com a publicação."
            rm -f runs.json
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Conta os runs de hoje já concluídos com sucesso OU ainda por
          # concluir (fila/em curso), excluindo o run atual.
          ATIVOS=$(jq --argjson run_atual "${GITHUB_RUN_ID}" '[
            .workflow_runs[]
            | select(.id != $run_atual)
            | select(
                (.conclusion == "success")
                or (.status == "queued")
                or (.status == "in_progress")
                or (.status == "waiting")
              )
          ] | length' runs.json)

          rm -f runs.json
          echo "Runs de hoje concluídos com sucesso ou em curso: ${ATIVOS}"

          if [ "${ATIVOS}" -gt 0 ]; then
            echo "Já existe uma execução bem-sucedida (ou em curso) hoje. A saltar para evitar publicação duplicada."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhuma publicação hoje. A prosseguir."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      # ============================================================
      # DIAGNÓSTICO DE HORÁRIO
      # ============================================================

      - name: Diagnóstico de horário
        shell: bash
        run: |
          echo "=================================================="
          echo "DIAGNÓSTICO DE HORÁRIO"
          echo "=================================================="

          echo ""
          echo "UTC:"
          date -u '+%Y-%m-%d %H:%M:%S %Z (%z)'

          echo ""
          echo "Hora do runner:"
          date '+%Y-%m-%d %H:%M:%S %Z (%z)'

          echo ""
          echo "Hora nos Açores:"
          TZ=Atlantic/Azores date '+%Y-%m-%d %H:%M:%S %Z (%z)'

          echo ""
          echo "Hora em Lisboa:"
          TZ=Europe/Lisbon date '+%Y-%m-%d %H:%M:%S %Z (%z)'

          echo ""
          echo "Timezone configurada no sistema:"
          timedatectl || true

          echo ""
          echo "Tipo de execução:"
          echo "${{ github.event_name }}"

          echo ""
          echo "=================================================="


      # ============================================================
      # CONTROLO DA JANELA DE PUBLICAÇÃO (07:00-07:59, Açores)
      # ============================================================
      # A hora de publicação é controlada pelo relógio DESTE step, não pela
      # hora a que o GitHub arranca o run:
      # - antes das 07:00  -> espera exatamente até às 07:00;
      # - 07:00-07:59      -> publica de imediato;
      # - depois das 08:00 -> fora da janela: alerta Telegram imediato e
      #   falha do run, para o dia nunca passar em silêncio.
      # O input `force` contorna esta verificação (bypass manual).
      # O input `test_mode` contorna também (bypass temporário para testes
      # fora de hora — desativar/remover quando os testes terminarem).

      - name: Controlar janela de publicação (07:00-08:00)
        if: steps.dedup.outputs.skip != 'true' && inputs.force != true && inputs.test_mode != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CONTROLO DA JANELA DE PUBLICAÇÃO (07:00-07:59)"
          echo "=================================================="

          get_azores_seconds() {
            local H M S
            H=$(TZ=Atlantic/Azores date +%H)
            M=$(TZ=Atlantic/Azores date +%M)
            S=$(TZ=Atlantic/Azores date +%S)
            echo $((10#$H * 3600 + 10#$M * 60 + 10#$S))
          }

          CURRENT_SECONDS=$(get_azores_seconds)
          TARGET_SECONDS=$((7 * 3600))

          # ----------------------------------------------------------
          # Antes das 07:00: espera até à hora exata de publicação.
          # Teto de 3h (10800s): arranques mais cedo do que isso são
          # anómalos e são cancelados — a sentinela das 08:15 UTC
          # tratará do alerta do dia.
          # ----------------------------------------------------------
          if [ "$CURRENT_SECONDS" -lt "$TARGET_SECONDS" ]; then
            WAIT_SECONDS=$((TARGET_SECONDS - CURRENT_SECONDS))

            if [ "$WAIT_SECONDS" -gt 10800 ]; then
              echo "ERRO: arranque demasiado cedo (faltam ${WAIT_SECONDS}s para as 07:00)."
              exit 1
            fi

            echo ""
            echo "Ainda não são 07:00 nos Açores. Faltam ${WAIT_SECONDS}s."
            echo "A aguardar até às 07:00..."
            sleep "$WAIT_SECONDS"
          fi

          HOUR=$(TZ=Atlantic/Azores date +%H)
          MINUTE=$(TZ=Atlantic/Azores date +%M)
          SECOND=$(TZ=Atlantic/Azores date +%S)
          CURRENT_TIME="${HOUR}:${MINUTE}:${SECOND}"

          echo ""
          echo "Hora após o controlo (Açores): ${CURRENT_TIME}"

          if [ "$HOUR" -ge 7 ] && [ "$HOUR" -lt 8 ]; then
            echo "OK: execução dentro da janela prevista (07:00-07:59)."
            echo "=================================================="
            exit 0
          fi

          # ----------------------------------------------------------
          # Fora da janela (ex.: GitHub atrasou o run para depois das
          # 08:00): alerta Telegram imediato + falha do job. Texto em
          # claro, sem parse_mode, para não depender de escaping.
          # ----------------------------------------------------------
          echo ""
          echo "ERRO: execução fora da janela permitida (07:00-07:59)."
          echo "A enviar alerta Telegram e a cancelar a publicação."

          ALERT_TEXT="⚠️ MEDITAÇÃO NÃO PUBLICADA — AÇÃO NECESSÁRIA ⚠️
          
          O run de hoje iniciou às ${CURRENT_TIME} (hora dos Açores), fora da janela obrigatória 07:00-08:00. A publicação foi cancelada.
          
          Executa o workflow manualmente (opção FORCE) ou verifica os logs no GitHub Actions para perceber porque é que o agendamento atrasou."

          jq -n --arg chat_id "${TELEGRAM_PERSONAL_CHAT_ID}" \
                --arg text "${ALERT_TEXT}" \
                '{chat_id: $chat_id, text: $text}' > tg_alert.json

          HTTP_CODE=$(curl -s -o tg_alert_resp.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data @tg_alert.json || true)
          [ -z "${HTTP_CODE}" ] && HTTP_CODE=000
          echo "Alerta Telegram: HTTP ${HTTP_CODE}"

          rm -f tg_alert.json tg_alert_resp.json
          echo "=================================================="
          exit 1


      # ============================================================
      # LOCALE PORTUGUÊS
      # ============================================================

      - name: Instalar o locale de Português Europeu (pt_PT)
        if: steps.dedup.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y language-pack-pt
          sudo locale-gen pt_PT.UTF-8
          sudo update-locale LANG=pt_PT.UTF-8


      # ============================================================
      # NODE.JS
      # ============================================================

      - name: Configurar o Node.js Environment
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # ============================================================
      # RESTAURAR SESSÃO WHATSAPP
      # ============================================================

      - name: Restaurar o Estado da Sessão do WhatsApp
        if: steps.dedup.outputs.skip != 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: meditacao_diaria.yml
          name: whatsapp-session
          path: whatsapp_auth
          if_no_artifact_found: warn


      # ============================================================
      # DEPENDÊNCIAS
      # ============================================================

      - name: Instalar dependências (Python & Node.js)
        if: steps.dedup.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3
          npm install whatsapp-web.js@1.34.7 qrcode-terminal


      # ============================================================
      # PUBLICAÇÃO TELEGRAM
      # ============================================================

      - name: Executar o script de publicação (Scraping & Telegram)
        if: steps.dedup.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python meditacao_iasdah.py


      # ============================================================
      # PUBLICAÇÃO WHATSAPP
      # ============================================================

      - name: Executar envio automatizado para o WhatsApp
        if: steps.dedup.outputs.skip != 'true'
        env:
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
        run: node send_whatsapp.js


      # ============================================================
      # ALERTA DE FALHA
      # ============================================================

      - name: Interceptar e Tratar Alerta de Sessão Expirada
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
        run: python alert_failure.py


      # ============================================================
      # LIMPEZA DA SESSÃO WHATSAPP
      # ============================================================

      - name: Limpar ficheiros socket antes do upload
        if: always()
        run: |
          rm -f \
            whatsapp_auth/session/SingletonSocket \
            whatsapp_auth/session/SingletonLock \
            whatsapp_auth/session/SingletonCookie


      # ============================================================
      # GUARDAR SESSÃO WHATSAPP
      # ============================================================

      - name: Guardar Estado Atualizado da Sessão do WhatsApp
        uses: actions/upload-artifact@v4.4.0
        if: always() && steps.dedup.outputs.skip != 'true'
        with:
          name: whatsapp-session
          path: whatsapp_auth
          retention-days: 90
          overwrite: true
          include-hidden-files: true
