name: Publicar Meditação Diária no Telegram e WhatsApp

on:
  schedule:
    # Cron fixo em UTC; os Açores alternam UTC+1 (verão) / UTC+0 (inverno).
    # Minutos fora de hora de propósito: slots no minuto zero estão saturados.
    # A deduplicação diária garante que só o primeiro run que completa publica.
    - cron: '23 6 * * *'
      timezone: 'Etc/GMT+1'

  workflow_dispatch:
    inputs:
      force:
        description: 'Ignorar a verificação de duplicação diária e publicar na mesma'
        type: boolean
        required: false
        default: false

# Mínimo necessário: ler metadados (deduplicação) e descarregar artefacto.
# Nota: nenhum passo assume formato ou comprimento do token (compatível com
# o novo formato stateless de GitHub App tokens, ghs_... ~520 chars) — o
# token é sempre injetado via Authorization header, sem validação própria.
permissions:
  contents: read
  actions: read

# Serializa execuções: o run seguinte é travado pela deduplicação (se o
# anterior teve sucesso) ou serve de retry (se falhou).
concurrency:
  group: meditacao-diaria
  cancel-in-progress: false


jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out uma cópia do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências Python
        run: pip install requests beautifulsoup4 urllib3

      - name: Verificar se já foi publicado hoje
        id: dedup
        if: inputs.force != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workflow_steps.py dedup

      - name: Alinhar com as 07:23 dos Açores (ajuste DST)
        if: steps.dedup.outputs.skip != 'true'
        run: python workflow_steps.py aguardar

      - name: Diagnóstico de horário
        if: steps.dedup.outputs.skip != 'true'
        run: |
          echo "UTC:            $(date -u '+%F %T %Z (%z)')"
          echo "Runner:         $(date '+%F %T %Z (%z)')"
          echo "Açores:         $(TZ=Atlantic/Azores date '+%F %T %Z (%z)')"
          echo "Tipo de execução: ${{ github.event_name }}"

      - name: Instalar o locale de Português Europeu (pt_PT)
        if: steps.dedup.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y language-pack-pt
          sudo locale-gen pt_PT.UTF-8
          sudo update-locale LANG=pt_PT.UTF-8

      - name: Configurar o Node.js Environment
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restaurar o Estado da Sessão do WhatsApp
        if: steps.dedup.outputs.skip != 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: meditacao_diaria.yml
          name: whatsapp-session
          path: .
          if_no_artifact_found: warn

      - name: Descompactar a sessão do WhatsApp
        if: steps.dedup.outputs.skip != 'true'
        run: |
          if [ -f whatsapp-session.tar.gz ]; then
            tar xzf whatsapp-session.tar.gz
            rm -f whatsapp-session.tar.gz
            echo "Sessão descompactada com sucesso."
          else
            echo "Aviso: tarball não encontrado — será necessário pareamento via QR Code."
          fi

      - name: Instalar dependências Node.js
        if: steps.dedup.outputs.skip != 'true'
        run: npm install whatsapp-web.js@1.34.7 qrcode-terminal

      - name: Executar o script de publicação (Scraping & Telegram)
        if: steps.dedup.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python meditacao_iasdah.py

      - name: Executar envio automatizado para o WhatsApp
        id: whatsapp
        if: steps.dedup.outputs.skip != 'true'
        env:
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
        run: node send_whatsapp.js

      - name: Interceptar e Tratar Alerta de Sessão Expirada
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
        run: python alert_failure.py

      # ============================================================
      # GUARDAR SESSÃO WHATSAPP (só se autenticada)
      # ============================================================
      # Condição baseada no marker .autenticado (escrito pelo send_whatsapp.js
      # quando o evento 'ready' dispara), NÃO no sucesso do envio: a sessão
      # fresca é preservada mesmo que o envio falhe depois da autenticação —
      # é isso que mantém a sessão válida pelos 90 dias de retenção em vez
      # de caducar a cada ~2 dias. Se o envio falhou ANTES de autenticar
      # (QR não lido), o marker não existe e o artefacto anterior é preservado.
      - name: Comprimir e guardar a sessão do WhatsApp
        if: steps.dedup.outputs.skip != 'true'
        run: |
          if [ ! -f whatsapp_auth/.autenticado ]; then
            echo "Sessão não autenticada neste run — a preservar o artefacto anterior."
            exit 0
          fi
          rm -f whatsapp_auth/session/Singleton{Socket,Lock,Cookie}
          rm -rf \
            whatsapp_auth/session/Default/Cache \
            whatsapp_auth/session/Default/Code\ Cache \
            whatsapp_auth/session/Default/GPUCache \
            whatsapp_auth/session/Default/Service\ Worker/CacheStorage \
            whatsapp_auth/session/Default/Service\ Worker/ScriptCache \
            whatsapp_auth/session/Default/GrShaderCache \
            whatsapp_auth/session/Default/DawnCache \
            whatsapp_auth/session/Default/Dictionaries \
            whatsapp_auth/session/Default/Crashpad \
            whatsapp_auth/session/Default/component_crx_cache \
            whatsapp_auth/session/Default/Storage/ext \
            whatsapp_auth/session/Default/blob_storage \
            whatsapp_auth/session/Default/File\ System
          tar czf whatsapp-session.tar.gz whatsapp_auth
          du -sh whatsapp-session.tar.gz

      - name: Upload do artefacto da sessão
        if: steps.dedup.outputs.skip != 'true' && hashFiles('whatsapp-session.tar.gz') != ''
        uses: actions/upload-artifact@v4.4.0
        with:
          name: whatsapp-session
          path: whatsapp-session.tar.gz
          retention-days: 90
          overwrite: true
          include-hidden-files: true