name: Publicar Meditação Diária no Telegram e WhatsApp

on:
  schedule:
    # GitHub Actions utiliza UTC.
    #
    # 06:00 UTC permite ao workflow calcular a hora real
    # em Atlantic/Azores e aguardar até às 07:00 locais.
    #
    # Verão (WEST, UTC+1):
    #   06:00 UTC = 07:00 Açores -> sem espera
    #
    # Inverno (WET, UTC+0):
    #   06:00 UTC = 06:00 Açores -> aguarda 1 hora
    #
    # Se o GitHub atrasar o arranque (comum ultimamente), o cálculo é feito
    # com base na hora real, não há sleep fixo, e a janela de publicação vai
    # até às 12:00 locais — um atraso não deixa o dia sem meditação.
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: 'Ignorar a verificação de duplicação diária e publicar na mesma'
        type: boolean
        required: false
        default: false


# GITHUB_TOKEN com o mínimo necessário: ler metadados (deduplicação via API
# de workflow runs) e descarregar o artefacto da sessão WhatsApp.
permissions:
  contents: read
  actions: read


jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # REPOSITÓRIO
      # ============================================================

      - name: Check out uma cópia do repositório
        uses: actions/checkout@v4


      # ============================================================
      # DEDUPLICAÇÃO DIÁRIA
      # ============================================================
      # Proteção contra publicações duplicadas no mesmo dia:
      # - runs agendados duplicados ou atrasados;
      # - execuções manuais quando o agendamento já correu com sucesso.
      # Consulta a API de workflow runs e salta a execução se já existir
      # um run de hoje concluído com sucesso (ou ainda em curso, para
      # cobrir a corrida entre um run agendado e um manual simultâneos).
      # Em caso de erro na API, falha aberta: publica na mesma — é pior
      # ficar um dia sem meditação do que arriscar um duplicado.

      - name: Verificar se já foi publicado hoje
        if: inputs.force != true
        id: dedup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          TODAY=$(TZ=Atlantic/Azores date +%F)
          echo "Data de referência (Atlantic/Azores): ${TODAY}"

          HTTP_CODE=$(curl -s -o runs.json -w '%{http_code}' -G \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "created=>=${TODAY}" \
            --data-urlencode "per_page=100" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/meditacao_diaria.yml/runs")

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::warning::Deduplicação indisponível (HTTP ${HTTP_CODE}). A prosseguir com a publicação."
            rm -f runs.json
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Conta os runs de hoje já concluídos com sucesso OU ainda por
          # concluir (fila/em curso), excluindo o run atual.
          ATIVOS=$(jq --argjson run_atual "${GITHUB_RUN_ID}" '[
            .workflow_runs[]
            | select(.id != $run_atual)
            | select(
                (.conclusion == "success")
                or (.status == "queued")
                or (.status == "in_progress")
                or (.status == "waiting")
              )
          ] | length' runs.json)

          rm -f runs.json
          echo "Runs de hoje concluídos com sucesso ou em curso: ${ATIVOS}"

          if [ "${ATIVOS}" -gt 0 ]; then
            echo "Já existe uma execução bem-sucedida (ou em curso) hoje. A saltar para evitar publicação duplicada."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhuma publicação hoje. A prosseguir."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      # ============================================================
      # DIAGNÓSTICO DE HORÁRIO
      # ============================================================

      - name: Diagnóstico de horário
        shell: bash
        run: |
          echo "=================================================="
          echo "DIAGNÓSTICO DE HORÁRIO"
          echo "=================================================="

          echo ""
          echo "UTC:"
          date -u '+%Y-%m-%d %H:%M:%S %Z (%z)'

          echo ""
          echo "Hora do runner:"
          date '+%Y-%m-%d %H:%M:%S %Z (%z)'

          echo ""
          echo "Hora nos Açores:"
          TZ=Atlantic/Azores date '+%Y-%m-%d %H:%M:%S %Z (%z)'

          echo ""
          echo "Hora em Lisboa:"
          TZ=Europe/Lisbon date '+%Y-%m-%d %H:%M:%S %Z (%z)'

          echo ""
          echo "Timezone configurada no sistema:"
          timedatectl || true

          echo ""
          echo "Tipo de execução:"
          echo "${{ github.event_name }}"

          echo ""
          echo "=================================================="


      # ============================================================
      # CONTROLO DO HORÁRIO DE PUBLICAÇÃO
      # ============================================================

      - name: Aguardar até às 07:00 nos Açores
        if: github.event_name == 'schedule' && steps.dedup.outputs.skip != 'true'
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CONTROLO DE HORÁRIO"
          echo "=================================================="

          # Obter a hora atual nos Açores.
          HOUR=$(TZ=Atlantic/Azores date +%H)
          MINUTE=$(TZ=Atlantic/Azores date +%M)
          SECOND=$(TZ=Atlantic/Azores date +%S)

          echo "Hora atual nos Açores: ${HOUR}:${MINUTE}:${SECOND}"

          # Converter a hora atual para segundos desde a meia-noite.
          CURRENT_SECONDS=$((10#$HOUR * 3600 + 10#$MINUTE * 60 + 10#$SECOND))

          # 07:00:00 = 7 * 3600 segundos.
          TARGET_SECONDS=$((7 * 3600))

          echo "Hora alvo: 07:00:00"

          # ----------------------------------------------------------
          # CASO 1:
          # Ainda não são 07:00.
          # Calculamos exatamente quanto falta.
          # ----------------------------------------------------------

          if [ "$CURRENT_SECONDS" -lt "$TARGET_SECONDS" ]; then

            WAIT_SECONDS=$((TARGET_SECONDS - CURRENT_SECONDS))

            echo ""
            echo "Ainda não são 07:00 nos Açores."
            echo "Faltam ${WAIT_SECONDS} segundos."
            echo "A aguardar até às 07:00..."

            sleep "$WAIT_SECONDS"

          fi

          # ----------------------------------------------------------
          # Mostrar a hora depois da espera.
          # ----------------------------------------------------------

          echo ""
          echo "Hora após o controlo:"
          TZ=Atlantic/Azores date '+%Y-%m-%d %H:%M:%S %Z (%z)'

          echo ""
          echo "=================================================="


      # ============================================================
      # VERIFICAÇÃO FINAL DO HORÁRIO
      # ============================================================

      - name: Confirmar janela de publicação
        if: github.event_name == 'schedule' && steps.dedup.outputs.skip != 'true'
        shell: bash
        run: |
          set -e

          HOUR=$(TZ=Atlantic/Azores date +%H)
          MINUTE=$(TZ=Atlantic/Azores date +%M)
          SECOND=$(TZ=Atlantic/Azores date +%S)

          CURRENT_TIME="${HOUR}:${MINUTE}:${SECOND}"

          echo "=================================================="
          echo "VERIFICAÇÃO FINAL"
          echo "=================================================="
          echo "Hora nos Açores: ${CURRENT_TIME}"

          # A publicação é permitida entre 07:00:00 e 11:59:59.
          #
          # O limite superior é tolerante de propósito: nos últimos tempos o
          # GitHub tem iniciado os runs agendados com atraso, e cancelar às
          # 08:00 deixava o dia sem meditação. A deduplicação diária (step
          # "Verificar se já foi publicado hoje") garante que só há uma
          # publicação por dia, mesmo com a janela alargada.
          #
          # Continuam bloqueadas, por exemplo, execuções à tarde/noite fora
          # de horas ou repetições indevidas.

          if [ "$HOUR" -ge 7 ] && [ "$HOUR" -lt 12 ]; then
            echo "OK: execução dentro da janela prevista (07:00-11:59)."
          else
            echo ""
            echo "ERRO: execução fora da janela permitida!"
            echo "Hora atual nos Açores: ${CURRENT_TIME}"
            echo ""
            echo "A publicação será CANCELADA para evitar"
            echo "o envio da meditação fora do horário previsto."
            echo "=================================================="
            exit 1
          fi

          echo "=================================================="


      # ============================================================
      # LOCALE PORTUGUÊS
      # ============================================================

      - name: Instalar o locale de Português Europeu (pt_PT)
        if: steps.dedup.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y language-pack-pt
          sudo locale-gen pt_PT.UTF-8
          sudo update-locale LANG=pt_PT.UTF-8


      # ============================================================
      # NODE.JS
      # ============================================================

      - name: Configurar o Node.js Environment
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # ============================================================
      # RESTAURAR SESSÃO WHATSAPP
      # ============================================================

      - name: Restaurar o Estado da Sessão do WhatsApp
        if: steps.dedup.outputs.skip != 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: meditacao_diaria.yml
          name: whatsapp-session
          path: whatsapp_auth
          if_no_artifact_found: warn


      # ============================================================
      # DEPENDÊNCIAS
      # ============================================================

      - name: Instalar dependências (Python & Node.js)
        if: steps.dedup.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3
          npm install whatsapp-web.js@1.34.7 qrcode-terminal


      # ============================================================
      # PUBLICAÇÃO TELEGRAM
      # ============================================================

      - name: Executar o script de publicação (Scraping & Telegram)
        if: steps.dedup.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python meditacao_iasdah.py


      # ============================================================
      # PUBLICAÇÃO WHATSAPP
      # ============================================================

      - name: Executar envio automatizado para o WhatsApp
        if: steps.dedup.outputs.skip != 'true'
        env:
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
        run: node send_whatsapp.js


      # ============================================================
      # ALERTA DE FALHA
      # ============================================================

      - name: Interceptar e Tratar Alerta de Sessão Expirada
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
        run: python alert_failure.py


      # ============================================================
      # LIMPEZA DA SESSÃO WHATSAPP
      # ============================================================

      - name: Limpar ficheiros socket antes do upload
        if: always()
        run: |
          rm -f \
            whatsapp_auth/session/SingletonSocket \
            whatsapp_auth/session/SingletonLock \
            whatsapp_auth/session/SingletonCookie


      # ============================================================
      # GUARDAR SESSÃO WHATSAPP
      # ============================================================

      - name: Guardar Estado Atualizado da Sessão do WhatsApp
        uses: actions/upload-artifact@v4.4.0
        if: always() && steps.dedup.outputs.skip != 'true'
        with:
          name: whatsapp-session
          path: whatsapp_auth
          retention-days: 90
          overwrite: true
          include-hidden-files: true
