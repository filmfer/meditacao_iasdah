name: Publicar Meditação Diária no Telegram e WhatsApp

on:
  schedule:
    - cron: '13 2 * * *'

  workflow_dispatch:
    inputs:
      pareamento:
        description: 'Gerar QR e atualizar sessão sem publicar'
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: read
  checks: read

concurrency:
  group: meditacao-diaria
  cancel-in-progress: false

jobs:
  build-and-send:
  
    permissions:
      actions: read
      contents: read
      checks: read
      
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      ############################################################
      # CHECKOUT
      ############################################################

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar hora do runner
        run: |
          echo "UTC:"
          date -u

          echo ""
          echo "Runner:"
          date

      ############################################################
      # AMBIENTE
      ############################################################

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar locale pt_PT
        run: |
          sudo apt-get update
          sudo apt-get install -y language-pack-pt
          sudo locale-gen pt_PT.UTF-8
          sudo update-locale LANG=pt_PT.UTF-8

      ############################################################
      # RESTAURAR SESSÃO
      ############################################################
      - name: Verificar sessão válida
        run: |
          python session_manager.py health || true
          
      - name: Restaurar sessão WhatsApp
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: meditacao_diaria.yml
          branch: main
          workflow_search: true
          workflow_conclusion: success
          name: whatsapp-session
          path: .
          if_no_artifact_found: warn

      - name: Mostrar contexto GitHub
        run: |
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Run ID: $GITHUB_RUN_ID"

      - name: Diagnóstico do download
        run: |
          echo "=== Conteúdo atual ==="
          ls -lah

          echo ""
          echo "=== Artefactos encontrados ==="
          find . -name "*.tar.gz" || true

      - name: Restaurar sessão
        run: python session_manager.py restore

      - name: Diagnóstico da sessão restaurada
        run: |
          echo "=== Sessão ==="

          if [ -d whatsapp_auth ]; then
            du -sh whatsapp_auth
          else
            echo "whatsapp_auth inexistente"
          fi

          echo ""
          echo "=== Markers ==="
          find whatsapp_auth -maxdepth 2 -type f 2>/dev/null | grep -E '\.(autenticado|ready|invalido)$' || true

      - name: Health check da sessão
        run: python session_manager.py health || true

      ############################################################
      # DEPENDÊNCIAS
      ############################################################

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip

          pip install requests
          pip install beautifulsoup4
          pip install urllib3

          npm install whatsapp-web.js@1.34.7
          npm install qrcode-terminal

      ############################################################
      # TELEGRAM
      ############################################################

      - name: Publicar Telegram
        if: ${{ !inputs.pareamento }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python meditacao_iasdah.py

      ############################################################
      # WHATSAPP
      ############################################################

      - name: Enviar WhatsApp
        id: whatsapp
        env:
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          WHATSAPP_PAREAMENTO: ${{ inputs.pareamento && '1' || '0' }}
        run: node send_whatsapp.js

      ############################################################
      # ALERTA DE FALHA
      ############################################################

      - name: Alerta de falha
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
        run: python alert_failure.py

      ############################################################
      # GUARDAR SESSÃO
      ############################################################

      - name: Limpar caches da sessão
        if: ${{ hashFiles('whatsapp_auth/.autenticado') != '' }}
        run: python session_manager.py clean

      - name: Health check final
        if: ${{ hashFiles('whatsapp_auth/.autenticado') != '' }}
        run: python session_manager.py health || true

      - name: Compactar sessão
        if: ${{ hashFiles('whatsapp_auth/.autenticado') != '' }}
        run: python session_manager.py compress

      - name: Verificar tarball
        if: ${{ hashFiles('whatsapp_auth/.autenticado') != '' }}
        run: |
          test -f whatsapp-session.tar.gz

          echo "=== Tarball ==="
          ls -lh whatsapp-session.tar.gz

      - name: Guardar sessão WhatsApp
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('whatsapp_auth/.autenticado') != '' }}
        with:
          name: whatsapp-session
          path: whatsapp-session.tar.gz
          retention-days: 90
          overwrite: true
          include-hidden-files: true

      - name: Diagnóstico final
        if: always()
        run: |
          echo "=== Artefactos locais ==="

          ls -lh *.tar.gz 2>/dev/null || true

          echo ""
          echo "=== Sessão ==="

          du -sh whatsapp_auth 2>/dev/null || true
