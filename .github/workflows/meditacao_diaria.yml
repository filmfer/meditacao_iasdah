name: Publicar Meditação Diária no Telegram e WhatsApp

on:
  schedule:
    # 06:18 UTC
    - cron: '18 6 * * *'

  workflow_dispatch:
    inputs:
      pareamento:
        description: 'Gerar QR e atualizar sessão sem publicar'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: meditacao-diaria
  cancel-in-progress: false

jobs:
  build-and-send:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar hora UTC
        run: |
          echo "UTC:"
          date -u

      ############################################################
      # PYTHON + NODE
      ############################################################

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locale pt_PT
        run: |
          sudo apt-get update
          sudo apt-get install -y language-pack-pt
          sudo locale-gen pt_PT.UTF-8

      ############################################################
      # RESTAURAR SESSÃO
      ############################################################

      - name: Restaurar artefacto da sessão
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: meditacao_diaria.yml
          name: whatsapp-session
          path: .
          if_no_artifact_found: warn

      - name: Diagnóstico do artefacto
        run: |
          echo "=== Diretório atual ==="
          ls -lah

          echo "=== Tarballs ==="
          find . -name "*.tar.gz" || true

      - name: Restaurar sessão
        run: python session_manager.py restore

      - name: Verificar sessão restaurada
        run: |
          du -sh whatsapp_auth 2>/dev/null || true
          find whatsapp_auth -name CURRENT 2>/dev/null | head || true

      ############################################################
      # DEPENDÊNCIAS
      ############################################################

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3
          npm install whatsapp-web.js@1.34.7 qrcode-terminal

      ############################################################
      # HEALTH CHECK
      ############################################################

      - name: Health check da sessão
        run: python session_manager.py health

      ############################################################
      # TELEGRAM
      ############################################################

      - name: Publicar Telegram
        if: ${{ !inputs.pareamento }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python meditacao_iasdah.py

      ############################################################
      # WHATSAPP
      ############################################################

      - name: Publicar WhatsApp
        id: whatsapp
        env:
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          WHATSAPP_PAREAMENTO: ${{ inputs.pareamento && '1' || '0' }}
        run: node send_whatsapp.js

      ############################################################
      # ALERTA DE ERRO
      ############################################################

      - name: Alerta de falha
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
        run: python alert_failure.py

      ############################################################
      # GUARDAR SESSÃO
      ############################################################

      - name: Limpar sessão
        if: ${{ hashFiles('whatsapp_auth/.autenticado') != '' }}
        run: python session_manager.py clean

      - name: Compactar sessão
        if: ${{ hashFiles('whatsapp_auth/.autenticado') != '' }}
        run: python session_manager.py compress

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('whatsapp_auth/.autenticado') != '' }}
        with:
          name: whatsapp-session
          path: whatsapp-session.tar.gz
          retention-days: 90
          overwrite: true
          include-hidden-files: true
