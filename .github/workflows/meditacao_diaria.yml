name: Publicar Meditação Diária no Telegram e WhatsApp

on:
  schedule:
    - cron: '18 6 * * *'

  workflow_dispatch:
    inputs:
      pareamento:
        description: 'Executar apenas pareamento WhatsApp'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: meditacao-diaria
  cancel-in-progress: false

jobs:

  build-and-send:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar hora do runner
        run: |
          echo "UTC:"
          date -u
          echo "Local:"
          date

      ############################################################
      # Ambiente
      ############################################################

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar locale pt_PT
        run: |
          sudo apt-get update
          sudo apt-get install -y language-pack-pt
          sudo locale-gen pt_PT.UTF-8
          sudo update-locale LANG=pt_PT.UTF-8

      ############################################################
      # Sessão WhatsApp - Restauro
      ############################################################

      - name: Restaurar sessão WhatsApp
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: meditacao_diaria.yml
          workflow_search: true
          workflow_conclusion: success
          name: whatsapp-session
          path: .
          if_no_artifact_found: warn

      - name: Diagnóstico do artefacto restaurado
        run: |
          echo "=== Conteúdo atual ==="
          ls -lah

          echo "=== Artefactos ==="
          find . -name "*.tar.gz" || true

      - name: Restaurar estrutura da sessão
        run: python session_manager.py restore

      - name: Validar estado da sessão
        run: python session_manager.py health

      ############################################################
      # Dependências
      ############################################################

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

          npm install whatsapp-web.js@1.34.7
          npm install qrcode-terminal

      ############################################################
      # Telegram
      ############################################################

      - name: Publicar Telegram
        if: ${{ !inputs.pareamento }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python meditacao_iasdah.py

      ############################################################
      # WhatsApp
      ############################################################

      - name: Enviar WhatsApp
        id: whatsapp
        env:
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          WHATSAPP_PAREAMENTO: ${{ inputs.pareamento && '1' || '0' }}
        run: node send_whatsapp.js

      ############################################################
      # Alertas
      ############################################################

      - name: Alerta de falha
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
        run: python alert_failure.py

      ############################################################
      # Persistência da sessão
      ############################################################

      - name: Limpar caches
        if: ${{ hashFiles('whatsapp_auth/.autenticado') != '' }}
        run: |
          python session_manager.py clean

      - name: Validar sessão antes de guardar
        if: ${{ hashFiles('whatsapp_auth/.autenticado') != '' }}
        run: |
          python session_manager.py health

      - name: Compactar sessão
        if: ${{ hashFiles('whatsapp_auth/.autenticado') != '' }}
        run: |
          python session_manager.py compress

      - name: Guardar sessão WhatsApp
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('whatsapp_auth/.autenticado') != '' }}
        with:
          name: whatsapp-session
          path: whatsapp-session.tar.gz
          retention-days: 90
          overwrite: true
          include-hidden-files: true

      - name: Mostrar conteúdo final da sessão
        if: always()
        run: |
          echo "=== Pasta WhatsApp ==="
          du -sh whatsapp_auth 2>/dev/null || true

          echo "=== Artefactos ==="
          ls -lah *.tar.gz 2>/dev/null || true
