name: Publicar Meditação Diária no Telegram e WhatsApp

on:
  schedule:
    # Cron fixo em UTC: 06:23 UTC = 07:23 locais (Açores) no verão.
    # No inverno o step "Esperar pelas 07:23" dorme 1h antes de publicar,
    # mantendo a hora local constante o ano inteiro.
    # Minutos fora de hora de propósito: o scheduler do GitHub é best-effort
    # e minutos incomuns reduzem os atrasos dos slots saturados.
    - cron: '23 6 * * *'

  workflow_dispatch:
    inputs:
      pareamento:
        description: 'Modo pareamento: gera QR Code no log, guarda a nova sessão e NÃO publica (recupera a sessão quando o artefacto se perde/expira)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

# Um run de cada vez; nunca duas publicações em paralelo.
concurrency:
  group: meditacao-diaria
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out uma cópia do repositório
        uses: actions/checkout@v4

      # ============================================================
      # ALINHAR COM AS 07:23 NOS AÇORES
      # ============================================================
      # O cron é fixo em UTC (06:23) e os Açores alternam UTC+1 (verão) /
      # UTC+0 (inverno). No inverno este step dorme 1h para publicar às
      # 07:23 locais; no verão não espera. Teto de 90 min.
      - name: Esperar pelas 07:23 locais (Açores)
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          ALVO=$((7 * 3600 + 23 * 60))   # 07:23 locais, em segundos
          H=$(TZ=Atlantic/Azores date +%H)
          M=$(TZ=Atlantic/Azores date +%M)
          AGORA=$((10#$H * 3600 + 10#$M * 60))
          if [ "$AGORA" -lt "$ALVO" ]; then
            ESPERA=$((ALVO - AGORA))
            if [ "$ESPERA" -le 5400 ]; then
              echo "A esperar ${ESPERA}s para publicar às 07:23 locais..."
              sleep "$ESPERA"
            else
              echo "Aviso: desvio de ${ESPERA}s além do teto de 90 min; a publicar de imediato."
            fi
          else
            echo "Hora local $(TZ=Atlantic/Azores date +%H:%M) — a publicar de imediato."
          fi

      # ============================================================
      # AMBIENTE
      # ============================================================

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar o locale pt_PT
        run: |
          sudo apt-get update
          sudo apt-get install -y language-pack-pt
          sudo locale-gen pt_PT.UTF-8
          sudo update-locale LANG=pt_PT.UTF-8

      # ============================================================
      # SESSÃO WHATSAPP: RESTAURAR
      # ============================================================

      - name: Restaurar a sessão do WhatsApp
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: meditacao_diaria.yml
          name: whatsapp-session
          path: .
          if_no_artifact_found: warn

      # O artefacto é guardado compactado (tar.gz) para reduzir o tamanho
      # de 600MB+ (caches do Chromium) para ~30-80MB.
      - name: Descompactar a sessão do WhatsApp
        shell: bash
        run: |
          if [ -f whatsapp-session.tar.gz ]; then
            tar xzf whatsapp-session.tar.gz
            rm -f whatsapp-session.tar.gz
            echo "Sessão descompactada com sucesso."
          else
            echo "Aviso: tarball não encontrado. Será necessário pareamento via QR Code (workflow_dispatch com pareamento=true)."
          fi

      - name: Instalar dependências (Python & Node.js)
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3
          npm install whatsapp-web.js@1.34.7 qrcode-terminal

      # ============================================================
      # PUBLICAÇÕES
      # ============================================================

      - name: Publicar no Telegram (Scraping & envio)
        if: inputs.pareamento != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python meditacao_iasdah.py

      - name: Enviar para o WhatsApp
        id: whatsapp
        env:
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          # Em modo pareamento: autentica via QR, persiste ./whatsapp_auth e
          # sai sem enviar mensagens nem exigir whatsapp_msg.txt. Os passos
          # de compressão/upload abaixo guardam a nova sessão no artefacto.
          WHATSAPP_PAREAMENTO: ${{ inputs.pareamento == true && '1' || '0' }}
        run: node send_whatsapp.js

      - name: Alerta de falha
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
        run: python alert_failure.py

      # ============================================================
      # SESSÃO WHATSAPP: GUARDAR (SÓ APÓS SUCESSO)
      # ============================================================
      # Condicionado ao sucesso do passo "whatsapp": se o envio falhar
      # (QR não lido → exit 1), preserva-se o último artefacto bom em vez
      # de o sobrescrever com uma sessão vazia/corrompida.
      - name: Limpar caches desnecessárias da sessão
        if: steps.whatsapp.outcome == 'success'
        shell: bash
        run: |
          rm -f \
            whatsapp_auth/session/SingletonSocket \
            whatsapp_auth/session/SingletonLock \
            whatsapp_auth/session/SingletonCookie
          rm -rf \
            whatsapp_auth/session/Default/Cache \
            whatsapp_auth/session/Default/Code\ Cache \
            whatsapp_auth/session/Default/GPUCache \
            whatsapp_auth/session/Default/Service\ Worker/CacheStorage \
            whatsapp_auth/session/Default/Service\ Worker/ScriptCache \
            whatsapp_auth/session/Default/GrShaderCache \
            whatsapp_auth/session/Default/DawnCache \
            whatsapp_auth/session/Default/Dictionaries \
            whatsapp_auth/session/Default/Crashpad \
            whatsapp_auth/session/Default/component_crx_cache \
            whatsapp_auth/session/Default/Storage/ext \
            whatsapp_auth/session/Default/blob_storage \
            whatsapp_auth/session/Default/File\ System
          du -sh whatsapp_auth 2>/dev/null || echo "whatsapp_auth não existe"

      - name: Comprimir sessão
        if: steps.whatsapp.outcome == 'success'
        shell: bash
        run: |
          # A sessão LocalAuth vive no perfil Chromium em session/Default/
          # (Local Storage/leveldb e IndexedDB) — a presença de qualquer uma
          # das stores comprova autenticação real.
          DEFAULT="whatsapp_auth/session/Default"
          LVLDB="$DEFAULT/Local Storage/leveldb"
          IDB="$DEFAULT/IndexedDB"

          if { [ -d "$LVLDB" ] && [ -s "$LVLDB/CURRENT" ]; } || \
             [ -n "$(find "$IDB" -type f 2>/dev/null | head -n1)" ]; then
            tar czf whatsapp-session.tar.gz whatsapp_auth
            ls -lh whatsapp-session.tar.gz
            # Nunca `tar | head` sob pipefail: o SIGPIPE mata o tar mesmo
            # com o tarball gerado.
            tar tzf whatsapp-session.tar.gz 2>/dev/null | head -30 || true
          else
            echo "ERRO: Sessão não encontrada em session/Default/. A preservar o artefacto anterior."
            find whatsapp_auth -maxdepth 3 2>/dev/null | head -60
            exit 1
          fi

      - name: Guardar sessão do WhatsApp
        uses: actions/upload-artifact@v4.4.0
        if: steps.whatsapp.outcome == 'success'
        with:
          name: whatsapp-session
          path: whatsapp-session.tar.gz
          retention-days: 90
          overwrite: true
          include-hidden-files: true